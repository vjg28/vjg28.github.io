<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Portrait dot density</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #05070d; color: #c3cadb; font: 400 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
    header { padding: 28px 24px 8px; max-width: 1120px; margin: 0 auto; }
    h1 { font: 400 2rem/1.1 "Cormorant Garamond", Georgia, serif; color: #fff; margin: 0 0 6px; }
    section { margin: 28px 0 0; }
    h2 { max-width: 1120px; margin: 0 auto 10px; padding: 0 24px; font: 500 1rem/1.3 "IBM Plex Sans", system-ui, sans-serif; color: #fff; }
    h2 span { color: #8d94a8; font-weight: 400; }
    iframe { display: block; width: 100%; height: 860px; border: 0; border-top: 1px solid #1c2130; border-bottom: 1px solid #1c2130; }
  </style>
</head>
<body>
  <header>
    <h1>Portrait dot density</h1>
    <p>The same hero at four densities. Move the mouse over each portrait to see how the dots react.</p>
  </header>
  <section><h2>1× <span>· current</span></h2><iframe src="../../index.html?dots=1" loading="lazy"></iframe></section>
  <section><h2>1.8× <span>· a little fuller</span></h2><iframe src="../../index.html?dots=1.8" loading="lazy"></iframe></section>
  <section><h2>3× <span>· dense, finer dots</span></h2><iframe src="../../index.html?dots=3" loading="lazy"></iframe></section>
  <section><h2>4.5× <span>· very dense, reads almost like a photo</span></h2><iframe src="../../index.html?dots=4.5" loading="lazy"></iframe></section>
</body>
</html>
